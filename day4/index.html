<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 Assignment</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <button id="theme-toggle" type="button">Dark mode</button>

    <!-- The 'for' attribute links this label directly to the textarea id -->
    <label for="note-text">Enter your note:</label>
    <textarea id="note-text" placeholder="Start typing..."></textarea>

    <!-- Counters for live character and word display -->
    <p id="char-count">0 / 200 characters</p>
    <p id="word-count">0 words</p>

    <button id="clear-btn" type="button">Clear</button>
  </main>
</body>
</html>
